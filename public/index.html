<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link href="/favicon.ico" rel="icon" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff;
      --text: #202124;
      --topbar-bg: #202124;
      --topbar-text: #fff;
      --button-bg: #f5f5f5;
      --button-border: #dcdcdc;
      --sign-in-bg: #1a73e8;
      --link: #1a73e8;
      --footer-text: #5f6368;
      --search-border: #dadce0;
      --search-focus-border: #4d90fe;
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      box-sizing: border-box;
    }

    /* Topbar Styling */
    .topbar {
      background: var(--topbar-bg);
      color: var(--topbar-text);
      font-size: 14px;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
    }

    .topbar-left a {
      color: var(--topbar-text);
      text-decoration: none;
      margin-right: 20px;
      cursor: pointer;
      font-weight: 500;
    }

    .topbar-left a:hover {
      text-decoration: underline;
    }

    .topbar-right a {
      color: var(--topbar-text);
      text-decoration: none;
      margin-left: 20px;
      padding: 8px 16px;
      background-color: var(--sign-in-bg);
      color: white;
      border-radius: 4px;
      font-weight: bold;
    }

    .topbar-right a:hover {
      background-color: #0c5bd2;
    }

    .apps-menu {
      display: none;
      position: absolute;
      top: 50px;
      right: 30px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1000;
      width: 200px;
      padding: 10px;
      box-sizing: border-box;
    }

    .apps-menu a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: 8px;
      font-size: 14px;
      text-align: center;
    }

    .apps-menu a:hover {
      background: #f0f0f0;
    }

    .apps-menu img {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      vertical-align: middle;
    }

    /* Main Content */
    .container {
      padding-top: 100px;
      padding-bottom: 100px;
      text-align: center;
    }

    /* Logo Styling */
    .logo-line {
      margin-bottom: 30px;
    }

    .logo-line img {
      width: 200px; /* Adjust logo size */
      height: auto;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--footer-text);
      padding: 20px;
      background-color: #f2f2f2;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Search Box */
    .search-box {
      width: 560px;
      height: 44px;
      padding: 0 15px;
      font-size: 18px;
      border: 1px solid var(--search-border);
      background: var(--bg);
      color: var(--text);
      border-radius: 24px;
      transition: border 0.3s ease;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--search-focus-border);
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      font-size: 14px;
      padding: 10px 24px;
      margin: 0 8px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      cursor: pointer;
      color: var(--text);
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="https://www.google.com" class="active">Search</a>
      <a href="https://www.google.com/imghp" target="_blank">Images</a>
    </div>
    <div class="topbar-right">
      <a href="https://accounts.google.com/SignUp" class="sign-in-btn">Sign In</a>
      <div class="apps-btn" onclick="toggleAppsMenu()">Apps</div>
    </div>
  </div>

  <!-- Apps Menu -->
  <div class="apps-menu" id="appsMenu">
    <a href="https://mail.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/1280px-Gmail_icon_%282020%29.svg.png" alt="Gmail Icon">
      Gmail
    </a>
    <a href="https://www.google.com/imghp" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Google_Images_logo.png" alt="Images Icon">
      Images
    </a>
    <a href="https://maps.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/Google_Maps_logo_2022.png" alt="Maps Icon">
      Maps
    </a>
    <a href="https://play.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/cb/Google_Play_Logo.png" alt="Play Icon">
      Play
    </a>
    <a href="https://www.youtube.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="YouTube Icon">
      YouTube
    </a>
    <a href="https://news.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Google_News_logo.svg" alt="News Icon">
      News
    </a>
    <a href="https://photos.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Google_Photos_logo_2020.svg" alt="Photos Icon">
      Photos
    </a>
    <a href="https://keep.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2d/Google_Keep_icon_%282013-2020%29.png" alt="Google Keep Icon">
      Google Keep
    </a>
    <a href="https://www.google.com/slides" target="_blank">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5zI-bnJi1EIvMaifWo5hu_DJfubgHl2W1WA&s" alt="Google Slides Icon">
      Google Slides
    </a>
    <a href="https://docs.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Google_Docs_logo.png" alt="Google Docs Icon">
      Google Docs
    </a>
    <a href="https://www.youtube.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="Google Vids Icon">
      Google Vids
    </a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">

    <!-- Logo -->
    <div class="logo-line">
      <img src="/google-logo.png" alt="Google Logo">
    </div>

    <!-- Search Box -->
    <input id="searchInput" class="search-box" placeholder="Search Google or type a URL" type="text">

    <!-- Buttons -->
    <div class="buttons">
      <button id="searchBtn" onclick="searchRedirect()">Google Search</button>
      <button id="luckyBtn" onclick="feelingLucky()">I'm Feeling Lucky</button>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <a href="https://ads.google.com" target="_blank">Advertising Programs</a>
    <a href="https://www.google.com/services/" target="_blank">Business Solutions</a>
    <a href="https://about.google/" target="_blank">About Google</a>
    <br>©2024 Google
  </footer>

  <script>
    // Toggle the Apps Menu visibility
    function toggleAppsMenu() {
      const appsMenu = document.getElementById('appsMenu');
      if (appsMenu.style.display === 'block') {
        appsMenu.style.display = 'none';
      } else {
        appsMenu.style.display = 'block';
      }
    }

    // Google Search redirect
    function searchRedirect() {
      const inputText = document.getElementById('searchInput').value.trim();
      if (inputText) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(inputText)}`;
      }
    }

    // "I'm Feeling Lucky" functionality
    function feelingLucky() {
      const inputText = document.getElementById('searchInput').value.trim().toLowerCase();
      const domainRegex = /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,6}(\/.*)?$/;

      if (domainRegex.test(inputText)) {
        if (!inputText.startsWith('http://') && !inputText.startsWith('https://')) {
          window.location.href = 'https://' + inputText;
        } else {
          window.location.href = inputText;
        }
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(inputText)}`;
      }
    }
  </script>

</body>
</html>
